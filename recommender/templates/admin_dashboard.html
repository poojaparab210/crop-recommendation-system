{% extends 'base.html' %}
{% load static %}
<title>{% block title %} Admin Dashboard {% endblock %}</title>

{% block content %}

<h3 class="mb-3"><i class="fa-solid fa-gauge"></i> Dashboard </h3>

<div class="row g-4 mb-4">
    <div class="col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <div class="text-muted">Users</div>
                    <div class="h3">{{total_users}}</div>
                </div>
                <i class="fa-solid fa-users fa-2xl text-success"></i>

            </div>
        </div>
    </div>
    
    <div class="col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <div class="text-muted">Prediction</div>
                    <div class="h3">{{total_predictions}}</div>
                </div>
                <i class="fa-solid fa-seedling fa-2xl text-success"></i>
                
            </div>
        </div>
    </div>
</div>

<div class="row g-4">
    <div class="col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body" style="height : 350px">
                <h5 class="mb-3"><i class="fa-solid fa-chart-column" ></i>Top Crops</h5>
                <canvas id="cropBar"></canvas>

            </div>
        </div>
    </div>
    
    <div class="col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body" style="height : 350px">
                <h5 class="mb-3"><i class="fa-solid fa-chart-line" ></i>Prediction (7 days)</h5>
                <canvas id="dailyLine"></canvas>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<script>
    const cropLabels = {{crop_labels_json|safe}};
    const cropCounts = {{crop_counts_json|safe}};
    const dayLabels = {{day_labels_json|safe}};
    const dayCounts = {{day_counts_json|safe}};
    
    function makeOrReplaceChart(canvasId, config){
        const existing = Chart.getChart(canvasId);
        if(existing) existing.destroy();
        const canvas = document.getElementById(canvasId);
        if(!canvas) return null;
        return new Chart(canvas, config);
    }
    makeOrReplaceChart('cropBar',{
        type : 'bar', 
        data : {
            labels : cropLabels, 
            datasets : [{
                label:'Count', 
                data:cropCounts, 
                backgroundColor: [ 
                    'rgba(255, 99, 132, 0.6)', 
                    'rgba(54, 162, 235, 0.6)', 
                    'rgba(255, 206, 86, 0.6)', 
                    'rgba(75, 192, 192, 0.6)', 
                    'rgba(153, 102, 255, 0.6)', 
                    'rgba(255, 159, 64, 0.6)' 
                ] 
            }] 
        }, 
        options:{
            responsive:true, 
            maintainAspectRatio:false 
        }
    });

    makeOrReplaceChart('dailyLine',{
        type : 'line', 
        data : {
            labels : dayLabels, 
            datasets : [{
                label:'Predictions', 
                data:dayCounts,
                fill:true
            }] 
        }, 
        options:{
            responsive:true, 
            maintainAspectRatio:false 
        }
    });
</script>
{% endblock %}

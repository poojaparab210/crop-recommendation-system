{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0">
            <div class="card-body p-4 p-md-5">
                <h4 class="mb-3"><i class="fa-solid fa-key"></i> Forgot Password</h4>
                <p class="text-muted small mb-4">Enter your registered email and set a new password.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="test@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <div class="input-group">
                            <input type="password" name="new_password" id="newPwd" class="form-control" placeholder="Minimum 6 characters" required>
                            <button class="btn btn-outline-secondary" type="button" id="toggleNewPwd" title="Show/Hide">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm New Password</label>
                        <div class="input-group">
                            <input type="password" name="confirm_password" id="confirmPwd" class="form-control" placeholder="Re-enter password" required>
                            <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPwd" title="Show/Hide">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Reset Password</button>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'login' %}" class="small text-decoration-none">
                        <i class="fa-solid fa-arrow-left"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    const toggle = (btnId, inpId) => {
        const btn = document.getElementById(btnId);
        const input = document.getElementById(inpId);
        if (!btn || !input) return;

        btn.addEventListener('click', function () {
            const icon = this.querySelector('i');
            input.type = (input.type === 'password') ? 'text' : 'password';
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });
    };

    toggle('toggleNewPwd', 'newPwd');
    toggle('toggleConfirmPwd', 'confirmPwd');
</script>
{% endblock %}
